[project]
name = "farmassistant"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymongo>=4.8.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "APScheduler>=3.10.4",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "owslib>=0.31.0",
    "rasterio>=1.3.10",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pillow>=10.4.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0"
]

[tool.vercel]
entrypoint = "backend.main:app"